[package]
name = "formwork"
version = "0.1.0"
edition = "2021"
description = "Ergonomic, watertight Higher-Kinded Data formworks for Rust"

[dependencies]
formwork-core = { path = "../formwork-core" }
formwork-macro = { path = "../formwork-macro" }
typed-builder = "0.23"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
