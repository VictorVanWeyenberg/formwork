[package]
name = "stress-test"
version = "0.1.0"
edition = "2024"

[dependencies]
typed-builder = "0.23"

formwork = { path = "../formwork" }
serde = { version = "1", features = ["derive"] }
serde_with = "3.22"
regex = "1.13"
uuid = { version = "1", features = ["v4", "serde"] }
either = { version = "1.17", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.151"
